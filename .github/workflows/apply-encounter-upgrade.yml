name: Apply encounter and balance upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - tools/_apply_upgrade.py
      - .github/workflows/apply-encounter-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply upgrade
        run: |
          set +e
          python - <<'PY' > upgrade-error.txt 2>&1
          import base64
          import re
          import zlib
          from pathlib import Path

          upgrade_path = Path("tools/_apply_upgrade.py").resolve()
          wrapper = upgrade_path.read_text(encoding="utf-8")
          match = re.search(r"b64decode\('([^']+)'\)", wrapper)
          if not match:
              raise SystemExit("Could not read the temporary upgrade payload.")

          source = zlib.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          source = source.replace(
              "updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)",
              "updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)",
              1,
          )
          source = source.replace(
              "block = '''\\n\\n# Story balance is applied after the complete enemy list is built.",
              "block = ''')\\n\\n# Story balance is applied after the complete enemy list is built.",
              1,
          )
          exec(
              compile(source, str(upgrade_path), "exec"),
              {"__name__": "__main__", "__file__": str(upgrade_path)},
          )
          PY
          status=$?
          set -e

          cat upgrade-error.txt
          if [ $status -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upgrade-error.txt
            git commit -m "Record encounter upgrade failure"
            git push
            exit $status
          fi
          rm -f upgrade-error.txt

      - name: Validate JSON and code
        run: |
          python -m json.tool story/encounters.json > /dev/null
          python -m py_compile text_adventure/*.py tools/make_encounters.py tools/check_balance.py
          node --check web/app.js
          python tools/check_balance.py

      - name: Remove temporary bootstrap files
        run: rm tools/_apply_upgrade.py .github/workflows/apply-encounter-upgrade.yml

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand custom encounters and rebalance combat"
          git push
