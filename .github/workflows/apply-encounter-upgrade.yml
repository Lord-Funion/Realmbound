name: Apply encounter and balance upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - tools/_apply_upgrade.py
      - .github/workflows/apply-encounter-upgrade.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply upgrade
        run: |
          set +e
          python tools/_apply_upgrade.py > upgrade-error.txt 2>&1
          status=$?

          if [ $status -ne 0 ] && grep -q "SyntaxError: '(' was never closed" upgrade-error.txt && grep -q "text_adventure/data.py" upgrade-error.txt; then
            python - <<'PY' >> upgrade-error.txt 2>&1
          from pathlib import Path
          path = Path("text_adventure/data.py")
          text = path.read_text(encoding="utf-8")
          marker = "\n# Story balance is applied after the complete enemy list is built."
          if "\n)\n\n# Story balance is applied" not in text:
              if marker not in text:
                  raise SystemExit("Could not find the known road-tuple repair marker.")
              text = text.replace(marker, "\n)\n\n# Story balance is applied after the complete enemy list is built.", 1)
              path.write_text(text, encoding="utf-8")
          PY
            repair_status=$?
            if [ $repair_status -eq 0 ]; then
              python tools/make_encounters.py >> upgrade-error.txt 2>&1
              status=$?
            else
              status=$repair_status
            fi
          fi

          cat upgrade-error.txt
          if [ $status -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add upgrade-error.txt
            git commit -m "Record encounter upgrade failure"
            git push
            exit $status
          fi
          rm -f upgrade-error.txt

      - name: Validate JSON and code
        run: |
          python -m json.tool story/encounters.json > /dev/null
          python -m py_compile text_adventure/*.py tools/make_encounters.py tools/check_balance.py
          node --check web/app.js
          python tools/check_balance.py

      - name: Remove temporary bootstrap files
        run: rm tools/_apply_upgrade.py .github/workflows/apply-encounter-upgrade.yml

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand custom encounters and rebalance combat"
          git push
