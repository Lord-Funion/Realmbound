name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build all editions and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out the Python and HTML5 versions
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the C++ port
        uses: actions/checkout@v6
        with:
          ref: cpp-port
          path: cpp-port-source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,2}([._-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0 or v1.0.0."
            exit 1
          fi

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake \
            g++ \
            mingw-w64 \
            zip

      - name: Check Python and HTML5 syntax
        shell: bash
        run: |
          python -m compileall -q main.py text_adventure
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          node --check web/app.js

      - name: Build the Linux C++ edition
        shell: bash
        run: |
          cmake \
            -S cpp-port-source/cpp \
            -B build/cpp-linux \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp-linux --config Release --parallel

      - name: Build the Windows C++ edition
        shell: bash
        run: |
          cmake \
            -S cpp-port-source/cpp \
            -B build/cpp-windows \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build build/cpp-windows --config Release --parallel

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package dist
          mkdir -p \
            package/Realmbound-Cpp-Linux-x86_64 \
            package/Realmbound-Cpp-Windows-x86_64 \
            package/Realmbound-Python \
            package/Realmbound-HTML5 \
            dist

          cp build/cpp-linux/Adventure-Game \
            package/Realmbound-Cpp-Linux-x86_64/
          cp build/cpp-linux/Adventure-Game-Linux.sh \
            package/Realmbound-Cpp-Linux-x86_64/
          cp build/cpp-linux/Adventure-Game.desktop \
            package/Realmbound-Cpp-Linux-x86_64/
          cp cpp-port-source/cpp/README.md \
            package/Realmbound-Cpp-Linux-x86_64/README.md

          cp build/cpp-windows/Adventure-Game.exe \
            package/Realmbound-Cpp-Windows-x86_64/
          cp cpp-port-source/cpp/README.md \
            package/Realmbound-Cpp-Windows-x86_64/README.md

          cp main.py README.md package/Realmbound-Python/
          cp -R text_adventure package/Realmbound-Python/
          cat > package/Realmbound-Python/run.sh <<'EOF'
          #!/usr/bin/env sh
          python3 main.py "$@"
          EOF
          cat > package/Realmbound-Python/run.bat <<'EOF'
          @echo off
          py -3 main.py %*
          EOF
          chmod +x package/Realmbound-Python/run.sh

          cp index.html README.md package/Realmbound-HTML5/
          cp -R web package/Realmbound-HTML5/

          tar -C package -czf \
            dist/Realmbound-Cpp-Linux-x86_64.tar.gz \
            Realmbound-Cpp-Linux-x86_64

          (
            cd package
            zip -qr \
              ../dist/Realmbound-Cpp-Windows-x86_64.zip \
              Realmbound-Cpp-Windows-x86_64
            zip -qr \
              ../dist/Realmbound-Python.zip \
              Realmbound-Python
            zip -qr \
              ../dist/Realmbound-HTML5.zip \
              Realmbound-HTML5
          )

          (
            cd dist
            sha256sum \
              Realmbound-Cpp-Linux-x86_64.tar.gz \
              Realmbound-Cpp-Windows-x86_64.zip \
              Realmbound-Python.zip \
              Realmbound-HTML5.zip \
              > SHA256SUMS.txt
          )

      - name: Prepare release notes
        shell: bash
        run: |
          CPP_SHA="$(git -C cpp-port-source rev-parse HEAD)"
          cat > release-notes.md <<EOF
          ## Included downloads

          - **Windows C++:** \`Realmbound-Cpp-Windows-x86_64.zip\`
          - **Linux C++:** \`Realmbound-Cpp-Linux-x86_64.tar.gz\`
          - **Python:** \`Realmbound-Python.zip\`
          - **HTML5:** \`Realmbound-HTML5.zip\`
          - **Checksums:** \`SHA256SUMS.txt\`

          Python and HTML5 commit: \`${GITHUB_SHA}\`  
          C++ port commit: \`${CPP_SHA}\`
          EOF

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Realmbound $RELEASE_TAG" \
              --notes-file release-notes.md \
              --generate-notes
          fi
