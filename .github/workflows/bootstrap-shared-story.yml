name: Generate shared story bundle

on:
  push:
    branches:
      - agent/shared-story-source
    paths:
      - tools/story_sync.py
      - .github/workflows/bootstrap-shared-story.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch port branches
        run: |
          git fetch origin main cpp-port legacy --no-tags

      - name: Build canonical JSON
        run: python tools/story_sync.py extract

      - name: Validate generated file
        run: |
          python -m json.tool story/realmbound_story.json >/dev/null
          python tools/story_sync.py summary
          git diff --check

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story/realmbound_story.json
          if git diff --cached --quiet; then
            echo "Story bundle is already current."
          else
            git commit -m "Generate shared story bundle"
            git push
          fi
