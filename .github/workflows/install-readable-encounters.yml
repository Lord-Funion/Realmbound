name: Install readable encounters

on:
  push:
    branches: [agent/readable-encounters]
    paths:
      - tools/make_encounters.py
      - .github/workflows/install-readable-encounters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and connect encounter data
        run: python tools/make_encounters.py
      - name: Validate
        run: |
          python -m json.tool story/encounters.json > /dev/null
          python -m py_compile text_adventure/encounter_data.py text_adventure/story.py
          node --check web/app.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Replace source dump with readable encounters"
          git push
