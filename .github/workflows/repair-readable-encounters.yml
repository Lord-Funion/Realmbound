name: Build readable encounters

# This branch change deliberately starts the pull-request build.
on:
  push:
    branches: [main]
    paths:
      - tools/make_encounters.py
      - .github/workflows/repair-readable-encounters.yml
  pull_request:
    branches: [main]
    paths:
      - tools/make_encounters.py
      - .github/workflows/repair-readable-encounters.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate readable encounter data
        run: PYTHONPATH=. python tools/make_encounters.py

      - name: Validate generated files
        run: |
          python -m json.tool story/encounters.json > /dev/null
          PYTHONPATH=. python -m py_compile text_adventure/encounter_data.py text_adventure/story.py
          node --check web/app.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Encounter files are already current."
            exit 0
          fi
          git commit -m "Replace source dump with readable encounters"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.head_ref }}"
          else
            git push
          fi
